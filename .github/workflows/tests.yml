name: Tests
on:
  push:
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 lua-dkjson
      - run: python -m unittest discover -s tests -v
      - run: lua tests/test_core.lua
      - run: node --check web/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_audio.py
      - run: python -m unittest discover -s tests -p test_audio.py -v
